version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - forbidigo
    - funlen
    - gosec
    - misspell
    - copyloopvar
    - errorlint
    - nilerr
    - nilnil
    - unconvert
    - unparam
    - prealloc
    - makezero
    - exhaustive
    - importas
    - bodyclose
    - rowserrcheck
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 12
    forbidigo:
      forbid:
        - pattern: import "[^"]+/(util|common|helpers)"
    funlen:
      lines: 90
    gosec:
      excludes:
        - G115
        # G703/G704: gosec's taint-analysis engine flags any function parameter
        # of a matching type (e.g. a file path or URL string) as tainted based
        # solely on its type, not on whether it actually originates from
        # untrusted input. This produces widespread false positives in library
        # code where callers pass in paths/URLs directly (see
        # https://github.com/securego/gosec/issues/1500).
        - G703
        - G704
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - internal
      - vectorstores/bedrockknowledgebases
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
