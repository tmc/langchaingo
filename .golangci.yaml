version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - forbidigo
    - funlen
    - gosec
    - misspell
    - copyloopvar
    - errorlint
    - nilerr
    - nilnil
    - unconvert
    - unparam
    - prealloc
    - makezero
    - exhaustive
    - importas
    - bodyclose
    - rowserrcheck
    - wastedassign
    - whitespace
  settings:
    cyclop:
      max-complexity: 12
    forbidigo:
      forbid:
        - pattern: import "[^"]+/(util|common|helpers)"
    funlen:
      lines: 90
    gosec:
      excludes:
        - G115
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # The stub is a proxy: forwarding the request it received is its purpose.
      - path: httputil/transport_test\.go
        linters:
          - gosec
        text: G704
      # url.Parse taints the helper, but what reaches os.Open is the name
      # os.CreateTemp chose, which the URL cannot influence.
      - path: documentloaders/whisper\.go
        linters:
          - gosec
        text: G703
      # Fetching the endpoint its caller configured is what this client does;
      # a url.URL parameter is a taint source by declaration.
      - path: vectorstores/qdrant/rest\.go
        linters:
          - gosec
        text: G704
    paths:
      - internal
      - vectorstores/bedrockknowledgebases
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
