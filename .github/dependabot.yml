# Weekly dependency updates, grouped into one pull request per ecosystem.
# Example modules are not listed: each is its own module, updated by hand
# after a release (make update-examples, then go get and go mod tidy).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    ignore:
      # chroma-go v0.3 (and the chroma modules that require it) drops
      # the openai and types packages that vectorstores/chroma imports.
      - dependency-name: github.com/testcontainers/testcontainers-go/modules/chroma
      - dependency-name: github.com/amikos-tech/chroma-go
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
