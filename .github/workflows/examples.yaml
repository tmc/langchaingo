name: Build Examples
on:
  push: {}
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover-examples:
    name: Discover Examples
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          # A buildable example is a directory "go build ." can run in:
          # one holding a go.mod (most examples are their own module) or
          # Go files directly. Keying on that rather than on directory
          # depth lets examples be grouped in a subdirectory without the
          # matrix trying to build the grouping directory, which holds no
          # Go files of its own.
          examples=$({ find ./examples -mindepth 2 -name go.mod -exec dirname {} \;
                       find ./examples -mindepth 2 -maxdepth 2 -name '*.go' -exec dirname {} \; ; } \
                     | sed 's|^\./examples/||' | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix={\"example\":$examples}" >> $GITHUB_OUTPUT
          echo "Found examples: $examples"

  build-example:
    name: Build ${{ matrix.example }}
    needs: discover-examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-examples.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: false
          cache-dependency-path: |
            go.sum
            examples/${{ matrix.example }}/go.sum
      - name: Build ${{ matrix.example }}
        run: |
          cd examples/${{ matrix.example }}
          echo "Building ${{ matrix.example }}"
          go mod tidy
          go build -o /dev/null .